<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Red Alert 2 Clone – Prototype</title>
<style>
  body { margin: 0; background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #0f0; z-index: 10; }
  #sidebar { position: absolute; right: 0; top: 0; width: 180px; height: 100%; background: #1a1a1a; border-left: 2px solid #0f0; padding: 10px; box-sizing: border-box; }
  button { display: block; width: 100%; margin: 5px 0; background: #003300; color: #0f0; border: 1px solid #0f0; padding: 8px; cursor: pointer; }
  button:hover { background: #005500; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #credits { font-size: 18px; margin-bottom: 15px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div>Credits: <span id="credits">5000</span></div>
  <div>Selected: <span id="selected">None</span></div>
  <div style="font-size:12px;margin-top:8px">Left-click: select / place<br>Right-click: move / attack<br>WASD or arrows: pan camera</div>
</div>
<div id="sidebar">
  <div id="credits">Credits: 5000</div>
  <h3>Build</h3>
  <button onclick="setBuildMode('power')">Power Plant ($300)</button>
  <button onclick="setBuildMode('barracks')">Barracks ($500)</button>
  <button onclick="setBuildMode('factory')">War Factory ($800)</button>
  <button onclick="setBuildMode('refinery')">Refinery ($1000)</button>
  <h3>Produce</h3>
  <button onclick="produce('gi')">GI ($200)</button>
  <button onclick="produce('tank')">Grizzly Tank ($700)</button>
  <button onclick="produce('harvester')">Harvester ($1000)</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth - 180;
canvas.height = window.innerHeight;

// ===== GAME STATE =====
const TILE = 32;
const MAP_W = 60, MAP_H = 40;
let credits = 5000;
let camera = { x: 0, y: 0 };
let selected = [];
let buildMode = null;
let entities = [];
let nextId = 1;

// Simple map: 0=grass, 1=ore
const map = Array.from({length: MAP_H}, () => Array(MAP_W).fill(0));
// Place some ore fields
for (let i = 0; i < 8; i++) {
  const ox = 10 + Math.floor(Math.random()*40);
  const oy = 8 + Math.floor(Math.random()*25);
  for (let dy=-2; dy<=2; dy++) for (let dx=-2; dx<=2; dx++) {
    if (Math.random() > 0.3) map[oy+dy][ox+dx] = 1;
  }
}

// ===== ENTITY FACTORY =====
function createBuilding(type, x, y, owner=0) {
  const costs = { power:300, barracks:500, factory:800, refinery:1000 };
  const hp = { power:400, barracks:600, factory:800, refinery:700 };
  return {
    id: nextId++, type, x, y, owner,
    hp: hp[type], maxHp: hp[type],
    w: type==='refinery'?2:1, h: type==='refinery'?2:1,
    isBuilding: true, selected: false
  };
}
function createUnit(type, x, y, owner=0) {
  const stats = {
    gi:       { hp:120, speed:1.4, range:4, dmg:15, cost:200 },
    tank:     { hp:300, speed:1.0, range:5, dmg:40, cost:700 },
    harvester:{ hp:250, speed:0.9, range:0, dmg:0,  cost:1000, cargo:0, maxCargo:700 }
  };
  const s = stats[type];
  return {
    id: nextId++, type, x, y, owner,
    hp: s.hp, maxHp: s.hp, speed: s.speed, range: s.range, dmg: s.dmg,
    target: null, path: [], isUnit: true, selected: false,
    cargo: s.cargo||0, maxCargo: s.maxCargo||0, harvesting: false
  };
}

// Starting Construction Yard
entities.push(createBuilding('power', 5, 5)); // temporary power so we can build
entities.push({
  id: nextId++, type: 'conyard', x: 4, y: 4, owner: 0,
  hp: 1000, maxHp: 1000, w: 2, h: 2, isBuilding: true, selected: false
});

// ===== INPUT =====
let mouse = { x:0, y:0, down:false, right:false };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left + camera.x;
  mouse.y = e.clientY - rect.top + camera.y;
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { // left
    mouse.down = true;
    handleLeftClick();
  } else if (e.button === 2) {
    handleRightClick();
  }
});
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  const speed = 12;
  if (e.key === 'w' || e.key === 'ArrowUp') camera.y -= speed;
  if (e.key === 's' || e.key === 'ArrowDown') camera.y += speed;
  if (e.key === 'a' || e.key === 'ArrowLeft') camera.x -= speed;
  if (e.key === 'd' || e.key === 'ArrowRight') camera.x += speed;
});

function setBuildMode(type) { buildMode = type; }
function produce(type) {
  const costs = { gi:200, tank:700, harvester:1000 };
  if (credits < costs[type]) return;
  // Find a barracks or factory
  const producer = entities.find(e => e.owner===0 && (
    (type==='gi' && e.type==='barracks') ||
    ((type==='tank'||type==='harvester') && e.type==='factory')
  ));
  if (!producer) return alert('Need Barracks (GI) or War Factory (vehicles)');
  credits -= costs[type];
  // Spawn near the building
  const u = createUnit(type, producer.x + 2 + Math.random(), producer.y + 1 + Math.random());
  entities.push(u);
  updateUI();
}

function handleLeftClick() {
  const tx = Math.floor(mouse.x / TILE);
  const ty = Math.floor(mouse.y / TILE);

  if (buildMode) {
    const cost = { power:300, barracks:500, factory:800, refinery:1000 }[buildMode];
    if (credits >= cost) {
      // simple placement check
      const b = createBuilding(buildMode, tx, ty);
      entities.push(b);
      credits -= cost;
      buildMode = null;
      updateUI();
    }
    return;
  }

  // Select units/buildings
  selected = [];
  entities.forEach(e => e.selected = false);
  for (const e of entities) {
    if (e.owner !== 0) continue;
    const ex = e.x * TILE, ey = e.y * TILE;
    const ew = (e.w||1)*TILE, eh = (e.h||1)*TILE;
    if (mouse.x >= ex && mouse.x < ex+ew && mouse.y >= ey && mouse.y < ey+eh) {
      e.selected = true;
      selected.push(e);
    }
  }
  updateUI();
}

function handleRightClick() {
  if (selected.length === 0) return;
  const tx = mouse.x / TILE;
  const ty = mouse.y / TILE;

  // Check if clicking enemy
  let enemy = null;
  for (const e of entities) {
    if (e.owner === 0) continue;
    const dist = Math.hypot(e.x - tx, e.y - ty);
    if (dist < 1.5) { enemy = e; break; }
  }

  for (const u of selected) {
    if (!u.isUnit) continue;
    if (enemy) {
      u.target = enemy;
      u.path = [];
    } else {
      u.target = null;
      u.path = [{x: tx, y: ty}]; // simple direct move for now
    }
  }
}

// ===== UPDATE =====
function update(dt) {
  for (const e of entities) {
    if (!e.isUnit) continue;

    // Harvester logic
    if (e.type === 'harvester') {
      if (e.cargo >= e.maxCargo) {
        // return to nearest refinery
        const ref = entities.find(b => b.type==='refinery' && b.owner===0);
        if (ref) {
          const dist = Math.hypot(e.x - (ref.x+1), e.y - (ref.y+1));
          if (dist < 1.5) {
            credits += e.cargo;
            e.cargo = 0;
            updateUI();
          } else {
            e.path = [{x: ref.x+1, y: ref.y+1}];
          }
        }
      } else {
        // find ore
        let best = null, bestD = 999;
        for (let y=0; y<MAP_H; y++) for (let x=0; x<MAP_W; x++) {
          if (map[y][x] === 1) {
            const d = Math.hypot(e.x-x, e.y-y);
            if (d < bestD) { bestD=d; best={x,y}; }
          }
        }
        if (best) {
          if (bestD < 1.2) {
            map[best.y][best.x] = 0; // mine
            e.cargo = Math.min(e.maxCargo, e.cargo + 50);
          } else {
            e.path = [best];
          }
        }
      }
    }

    // Combat
    if (e.target && e.target.hp > 0) {
      const dist = Math.hypot(e.x - e.target.x, e.y - e.target.y);
      if (dist <= e.range) {
        e.target.hp -= e.dmg * dt * 0.6;
        if (e.target.hp <= 0) {
          entities = entities.filter(en => en.id !== e.target.id);
          e.target = null;
        }
        continue; // don't move while shooting
      } else {
        e.path = [{x: e.target.x, y: e.target.y}];
      }
    }

    // Movement
    if (e.path && e.path.length) {
      const goal = e.path[0];
      const dx = goal.x - e.x, dy = goal.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.15) {
        e.path.shift();
      } else {
        e.x += (dx/dist) * e.speed * dt;
        e.y += (dy/dist) * e.speed * dt;
      }
    }
  }
}

// ===== RENDER =====
function draw() {
  // Clear
  ctx.fillStyle = '#0c1a0c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Camera bounds
  const startX = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const startY = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endX = Math.min(MAP_W, startX + Math.ceil(canvas.width / TILE) + 2);
  const endY = Math.min(MAP_H, startY + Math.ceil(canvas.height / TILE) + 2);

  // ===== TILES =====
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const px = x * TILE - camera.x;
      const py = y * TILE - camera.y;

      if (map[y][x] === 1) {
        // Ore – textured look
        ctx.fillStyle = '#5c4a1a';
        ctx.fillRect(px, py, TILE - 1, TILE - 1);

        // Ore nuggets
        ctx.fillStyle = '#c9a227';
        ctx.beginPath();
        ctx.arc(px + 10, py + 12, 4, 0, Math.PI * 2);
        ctx.arc(px + 20, py + 18, 3.5, 0, Math.PI * 2);
        ctx.arc(px + 14, py + 22, 3, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.fillStyle = 'rgba(255, 230, 120, 0.5)';
        ctx.beginPath();
        ctx.arc(px + 10, py + 11, 1.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Grass with variation
        const shade = ((x * 3 + y * 7) % 5);
        const colors = ['#1a331a', '#1e3a1e', '#183018', '#1c361c', '#163016'];
        ctx.fillStyle = colors[shade];
        ctx.fillRect(px, py, TILE - 1, TILE - 1);
      }
    }
  }

  // ===== ENTITIES =====
  for (const e of entities) {
    drawEntity(e);
  }

  // Build preview
  if (buildMode) {
    const tx = Math.floor(mouse.x / TILE);
    const ty = Math.floor(mouse.y / TILE);
    const size = buildMode === 'refinery' ? 2 : 1;
    const px = tx * TILE - camera.x;
    const py = ty * TILE - camera.y;

    ctx.fillStyle = 'rgba(0, 255, 100, 0.25)';
    ctx.fillRect(px, py, size * TILE, size * TILE);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(px + 1, py + 1, size * TILE - 2, size * TILE - 2);
    ctx.setLineDash([]);
  }

  requestAnimationFrame(loop);
}

function drawEntity(e) {
  const px = e.x * TILE - camera.x;
  const py = e.y * TILE - camera.y;
  const w = (e.w || 1) * TILE;
  const h = (e.h || 1) * TILE;

  if (e.isBuilding) {
    drawBuilding(e, px, py, w, h);
  } else {
    drawUnit(e, px, py, TILE);
  }

  // Health bar
  if (e.hp < e.maxHp) {
    const barW = Math.max(w, 20);
    ctx.fillStyle = '#1a0000';
    ctx.fillRect(px, py - 8, barW, 5);
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#22cc22' : ratio > 0.25 ? '#cccc22' : '#cc2222';
    ctx.fillRect(px, py - 8, barW * ratio, 5);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py - 8, barW, 5);
  }

  // Selection brackets
  if (e.selected) {
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1.5;
    const s = 6;
    // Top-left
    ctx.beginPath();
    ctx.moveTo(px, py + s);
    ctx.lineTo(px, py);
    ctx.lineTo(px + s, py);
    ctx.stroke();
    // Top-right
    ctx.beginPath();
    ctx.moveTo(px + w - s, py);
    ctx.lineTo(px + w, py);
    ctx.lineTo(px + w, py + s);
    ctx.stroke();
    // Bottom-left
    ctx.beginPath();
    ctx.moveTo(px, py + h - s);
    ctx.lineTo(px, py + h);
    ctx.lineTo(px + s, py + h);
    ctx.stroke();
    // Bottom-right
    ctx.beginPath();
    ctx.moveTo(px + w - s, py + h);
    ctx.lineTo(px + w, py + h);
    ctx.lineTo(px + w, py + h - s);
    ctx.stroke();
  }
}

function drawBuilding(e, px, py, w, h) {
  switch (e.type) {
    case 'conyard':
      // Large industrial base
      ctx.fillStyle = '#3d5c3d';
      ctx.fillRect(px, py, w, h);
      // Roof sections
      ctx.fillStyle = '#2a402a';
      ctx.fillRect(px + 4, py + 4, w - 8, 18);
      // Crane / arm
      ctx.fillStyle = '#555';
      ctx.fillRect(px + w - 18, py + 8, 10, 40);
      ctx.fillStyle = '#777';
      ctx.fillRect(px + w - 28, py + 12, 22, 6);
      // Windows
      ctx.fillStyle = '#88aacc';
      ctx.fillRect(px + 10, py + 30, 12, 8);
      ctx.fillRect(px + 28, py + 30, 12, 8);
      break;

    case 'power':
      // Power plant with smokestack
      ctx.fillStyle = '#2a4a6a';
      ctx.fillRect(px, py + 8, w, h - 8);
      // Smokestack
      ctx.fillStyle = '#444';
      ctx.fillRect(px + 10, py, 12, 20);
      ctx.fillStyle = '#666';
      ctx.fillRect(px + 12, py - 4, 8, 6);
      // Vents
      ctx.fillStyle = '#1a2a3a';
      ctx.fillRect(px + 4, py + 18, 8, 6);
      ctx.fillRect(px + 20, py + 18, 8, 6);
      break;

    case 'barracks':
      // Barracks – long building
      ctx.fillStyle = '#5a3a3a';
      ctx.fillRect(px, py, w, h);
      // Roof
      ctx.fillStyle = '#3a2525';
      ctx.fillRect(px + 2, py + 2, w - 4, 10);
      // Door
      ctx.fillStyle = '#222';
      ctx.fillRect(px + 10, py + 18, 12, 12);
      // Windows
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(px + 4, py + 14, 6, 5);
      ctx.fillRect(px + 22, py + 14, 6, 5);
      break;

    case 'factory':
      // War Factory
      ctx.fillStyle = '#5a5a2a';
      ctx.fillRect(px, py, w, h);
      // Large door
      ctx.fillStyle = '#333';
      ctx.fillRect(px + 8, py + 20, w - 16, 24);
      // Roof machinery
      ctx.fillStyle = '#777';
      ctx.fillRect(px + 6, py + 4, 20, 10);
      ctx.fillRect(px + 30, py + 6, 16, 8);
      break;

    case 'refinery':
      // Ore Refinery
      ctx.fillStyle = '#6a4a2a';
      ctx.fillRect(px, py, w, h);
      // Silo
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath();
      ctx.arc(px + 20, py + 22, 16, 0, Math.PI * 2);
      ctx.fill();
      // Conveyor / pad
      ctx.fillStyle = '#444';
      ctx.fillRect(px + 36, py + 28, 24, 14);
      // Pipe
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px + 30, py + 18);
      ctx.lineTo(px + 42, py + 28);
      ctx.stroke();
      break;

    default:
      ctx.fillStyle = '#555';
      ctx.fillRect(px, py, w, h);
  }

  // Building outline
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
}

function drawUnit(e, px, py, TILE) {
  const cx = px + TILE / 2;
  const cy = py + TILE / 2;

  switch (e.type) {
    case 'gi': {
      // Infantry – small soldier
      // Body
      ctx.fillStyle = '#4a7a4a';
      ctx.fillRect(cx - 4, cy - 2, 8, 10);
      // Head
      ctx.fillStyle = '#d4a574';
      ctx.beginPath();
      ctx.arc(cx, cy - 6, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // Helmet
      ctx.fillStyle = '#3a5a3a';
      ctx.beginPath();
      ctx.arc(cx, cy - 7, 3.8, Math.PI, 0);
      ctx.fill();
      // Gun
      ctx.fillStyle = '#333';
      ctx.fillRect(cx + 3, cy - 1, 7, 2);
      break;
    }

    case 'rocketeer': {
      // Flying infantry
      ctx.fillStyle = '#3a6aaa';
      ctx.fillRect(cx - 4, cy - 2, 8, 9);
      // Head
      ctx.fillStyle = '#d4a574';
      ctx.beginPath();
      ctx.arc(cx, cy - 6, 3.2, 0, Math.PI * 2);
      ctx.fill();
      // Jetpack flames
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy + 8);
      ctx.lineTo(cx - 2, cy + 14);
      ctx.lineTo(cx + 1, cy + 8);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 1, cy + 8);
      ctx.lineTo(cx + 4, cy + 14);
      ctx.lineTo(cx + 7, cy + 8);
      ctx.fill();
      break;
    }

    case 'tank': {
      // Grizzly Tank
      // Tracks
      ctx.fillStyle = '#333';
      ctx.fillRect(cx - 12, cy + 4, 24, 7);
      // Hull
      ctx.fillStyle = '#5a7a5a';
      ctx.fillRect(cx - 11, cy - 4, 22, 10);
      // Turret
      ctx.fillStyle = '#4a6a4a';
      ctx.beginPath();
      ctx.arc(cx, cy - 2, 7, 0, Math.PI * 2);
      ctx.fill();
      // Barrel
      ctx.fillStyle = '#333';
      ctx.fillRect(cx + 5, cy - 4, 14, 3);
      break;
    }

    case 'ifv': {
      // Infantry Fighting Vehicle
      ctx.fillStyle = '#333';
      ctx.fillRect(cx - 11, cy + 3, 22, 6);
      ctx.fillStyle = '#6a8a4a';
      ctx.fillRect(cx - 10, cy - 5, 20, 10);
      // Turret
      ctx.fillStyle = '#5a7a3a';
      ctx.fillRect(cx - 4, cy - 8, 8, 6);
      // Barrel
      ctx.fillStyle = '#222';
      ctx.fillRect(cx + 3, cy - 7, 10, 2);
      break;
    }

    case 'harvester': {
      // Chrono Miner / Ore Truck
      // Body
      ctx.fillStyle = '#8a7a30';
      ctx.fillRect(cx - 13, cy - 6, 26, 14);
      // Cabin
      ctx.fillStyle = '#6a5a20';
      ctx.fillRect(cx - 13, cy - 10, 10, 8);
      // Wheel / tracks
      ctx.fillStyle = '#333';
      ctx.fillRect(cx - 12, cy + 6, 8, 5);
      ctx.fillRect(cx + 4, cy + 6, 8, 5);
      // Cargo indicator
      if (e.cargo > 0) {
        const load = e.cargo / e.maxCargo;
        ctx.fillStyle = '#c9a227';
        ctx.fillRect(cx - 2, cy - 4, 12 * load, 8);
      }
      break;
    }

    default:
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.fill();
  }
}

function updateUI() {
  document.getElementById('credits').textContent = Math.floor(credits);
  document.querySelectorAll('#sidebar #credits').forEach(el => el.textContent = 'Credits: ' + Math.floor(credits));
  document.getElementById('selected').textContent = selected.length ? selected.map(s=>s.type).join(', ') : 'None';
}

// main loop
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
}
updateUI();
loop(performance.now());
</script>
</body>
</html>
